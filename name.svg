<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Rajasekar M — Associate Engineer, Development at Aptean">
  <title>Rajasekar M</title>
  <defs>
    <!-- Gold gradient with a moving shimmer -->
    <linearGradient id="gold" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#8A6A22"/>
      <stop offset="0.25" stop-color="#D4AF37"/>
      <stop offset="0.45" stop-color="#F7E7A6"/>
      <stop offset="0.5"  stop-color="#FFF8DC"/>
      <stop offset="0.55" stop-color="#F7E7A6"/>
      <stop offset="0.75" stop-color="#D4AF37"/>
      <stop offset="1"    stop-color="#8A6A22"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-900 0; 900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Static gold used under the shimmer so the letters never go dark -->
    <linearGradient id="goldBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F3D98B"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1"   stop-color="#9C7A2B"/>
    </linearGradient>

    <linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#D4AF37" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .eyebrow { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; letter-spacing: 9px; fill: #C9B37A; }
      .name    { font-family: 'Didot', 'Bodoni 72', 'Bodoni MT', 'Playfair Display', 'Cambria', Georgia, 'Times New Roman', serif;
                 font-size: 76px; font-weight: 400; letter-spacing: 14px; }
      .role    { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; letter-spacing: 6px; fill: #E8DDBE; }
      .accent  { fill: #D4AF37; }
    </style>
  </defs>

  <!-- Eyebrow -->
  <text class="eyebrow" x="457" y="42" text-anchor="middle">
    HELLO, I’M
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Name: solid gold base + shimmer layer on top -->
  <g filter="url(#glow)">
    <text class="name" x="457" y="125" text-anchor="middle" fill="url(#goldBase)">RAJASEKAR M</text>
    <text class="name" x="457" y="125" text-anchor="middle" fill="url(#gold)" opacity="0.85">RAJASEKAR M</text>
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </g>

  <!-- Ornament: line ◆ line, drawn outward from the centre -->
  <g>
    <line x1="250" y1="158" x2="436" y2="158" stroke="url(#lineL)" stroke-width="1.2">
      <animate attributeName="x1" values="436;250" dur="1.4s" begin="0.4s" fill="freeze"/>
    </line>
    <line x1="464" y1="158" x2="650" y2="158" stroke="url(#lineR)" stroke-width="1.2">
      <animate attributeName="x2" values="464;650" dur="1.4s" begin="0.4s" fill="freeze"/>
    </line>
    <rect x="445.5" y="152.5" width="9" height="9" fill="none" stroke="#D4AF37" stroke-width="1.6" transform="rotate(45 450 157)"/>
    <circle cx="450" cy="157" r="1.6" fill="#D4AF37"/>
  </g>

  <!-- Role -->
  <text class="role" x="453" y="196" text-anchor="middle">
    ASSOCIATE ENGINEER <tspan class="accent">·</tspan> DEVELOPMENT <tspan class="accent">·</tspan> APTEAN
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="2.2s" fill="freeze"/>
  </text>
</svg>
